<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="160" cy="160" r="154" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="5"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="#f43f5e" stroke-opacity="0.25" stroke-dasharray="4,6" stroke-width="2"/>

  <!-- Audio Wave Rings -->
  <g opacity="0.3" stroke="#fb7185" stroke-width="2" fill="none">
    <path d="M 60 160 A 100 100 0 0 1 260 160" />
    <path d="M 80 160 A 80 80 0 0 1 240 160" />
  </g>

  <!-- Headphone Icon Motif -->
  <g transform="translate(160, 105) scale(0.9)" filter="url(#glow)">
    <path d="M -36 12 C -36 -18, 36 -18, 36 12" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
    <rect x="-44" y="8" width="16" height="26" rx="8" fill="#f43f5e"/>
    <rect x="28" y="8" width="16" height="26" rx="8" fill="#f43f5e"/>
  </g>

  <!-- Initials -->
  <text x="160" y="195" font-family="'Cinzel', 'Georgia', serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
    MA
  </text>

  <!-- Label Banner -->
  <rect x="50" y="228" width="220" height="28" rx="14" fill="#0b111e" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="160" y="247" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="1.8">
    AUDIBLE ENSEMBLE
  </text>
  
  <text x="160" y="278" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle" opacity="0.9">
    Dolby Atmos Voice Artist
  </text>
</svg>